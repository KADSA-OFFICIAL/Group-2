; 일반판·검열판 내보내기 프리셋 예시 (#586). docs/release-editions.md 참고.
; 저장소 루트의 export_presets.cfg 는 사람마다 따로 두므로 커밋하지 않는다.
; 이미 쓰는 프리셋이 있으면 그 프리셋에 아래 두 줄(custom_features, exclude_filter)만 옮긴다.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="assets_censored/*"
export_path="export/general/StoneageShipduck.exe"

[preset.0.options]

binary_format/embed_pck=true

[preset.1]

name="Windows Censored"
platform="Windows Desktop"
runnable=false
custom_features="censored"
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="export/censored/StoneageShipduck.exe"

[preset.1.options]

binary_format/embed_pck=true
